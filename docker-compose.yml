services:
  # ============================================
  # OpenClaw - AI 助手主体
  # 通过飞书/Web 等渠道与用户交互
  # 原生支持 GitHub Copilot 模型（无需额外代理） - updated config reload
  # updated: 2026-05-25 v2026.5.22
  # updated: 2026-05-25 v2026.5.22
  # ============================================
  openclaw:
    build: .
    image: openclaw-custom:latest
    container_name: openclaw
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    environment:
      HOME: /home/node
      TERM: xterm-256color
      # Speed up repeated CLI runs (including health checks) on small VMs.
      NODE_COMPILE_CACHE: /var/tmp/openclaw-compile-cache
      # Keep routine gateway restarts in-process instead of respawning.
      OPENCLAW_NO_RESPAWN: "1"
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
      OPENCLAW_GATEWAY_MODE: local
      FEISHU_APP_ID: ${FEISHU_APP_ID}
      FEISHU_APP_SECRET: ${FEISHU_APP_SECRET}
      # GitHub Copilot 原生支持（通过 github-copilot provider）
      COPILOT_GITHUB_TOKEN: ${COPILOT_GITHUB_TOKEN}
      # 启动时自动幂等安装的 skills（安装后保存在 /home/node/.agents）
      OPENCLAW_BOOTSTRAP_SKILLS: ${OPENCLAW_BOOTSTRAP_SKILLS:-erichowens/some_claude_skills@photo-composition-critic,inferen-sh/skills@product-photography}
      # 第三方集成（通过 .env 配置）
      NOTION_API_KEY: ${NOTION_API_KEY:-}
      GITHUB_PAT: ${GITHUB_PAT:-}
      BRAVE_API_KEY: ${BRAVE_API_KEY:-}
    volumes:
      - ./data/openclaw:/home/node/.openclaw
      - ./data/agents:/home/node/.agents
      - whisper-models:/home/node/.cache/huggingface
    ports:
      # Gateway 端口（飞书 webhook 需要公网访问，不能绑定 localhost）
      - "${OPENCLAW_GATEWAY_PORT:-18789}:18789"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    command:
      - "sh"
      - "-lc"
      - "bootstrap-skills.sh && exec node dist/index.js gateway --bind lan --port 18789 --allow-unconfigured"
    healthcheck:
      test: ["CMD", "node", "dist/index.js", "health", "--timeout", "30000"]
      interval: 60s
      timeout: 45s
      retries: 5
      start_period: 180s

volumes:
  whisper-models:
