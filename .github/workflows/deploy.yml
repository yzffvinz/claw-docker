name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'docker-compose.yml'
      - 'litellm_config.yaml'
      - '.github/workflows/deploy.yml'

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Deploy
        run: |
          cd ~/claw-docker
          git pull
          docker compose pull
          docker compose up -d --remove-orphans
