# ============================================
# LiteLLM Proxy 配置
# 统一管理 GitHub Copilot 模型
# ============================================

litellm_settings:
  # 自动丢弃目标 API 不支持的参数
  drop_params: true

model_list:
  # ----------------------------------------
  # Claude Opus 4.6 (通过 GitHub Copilot / Coxy)
  # 主力模型
  # ----------------------------------------
  - model_name: claude-opus-4-6
    litellm_params:
      model: openai/claude-opus-4.6
      api_base: http://copilot-proxy:3000/api
      api_key: os.environ/COPILOT_PROXY_TOKEN
    model_info:
      max_input_tokens: 125000
      max_output_tokens: 16384

  # ----------------------------------------
  # Claude Sonnet 4.5 (通过 GitHub Copilot / Coxy)
  # 快速模型 — 速度快、质量稳，日常任务首选
  # ----------------------------------------
  - model_name: claude-sonnet-4-5
    litellm_params:
      model: openai/claude-sonnet-4.5
      api_base: http://copilot-proxy:3000/api
      api_key: os.environ/COPILOT_PROXY_TOKEN
    model_info:
      max_input_tokens: 125000
      max_output_tokens: 8192

  # ----------------------------------------
  # GPT-5.3 Codex (通过 GitHub Copilot / Coxy)
  # 代码任务专用
  # ----------------------------------------
  - model_name: gpt-5-3-codex
    litellm_params:
      model: openai/gpt-5.3-codex
      api_base: http://copilot-proxy:3000/api
      api_key: os.environ/COPILOT_PROXY_TOKEN
    model_info:
      max_input_tokens: 128000
      max_output_tokens: 16384

  # ----------------------------------------
  # Azure OpenAI text-embedding-3-small
  # 用于 OpenClaw memory_search 向量检索
  # ----------------------------------------
  - model_name: text-embedding-3-small
    litellm_params:
      model: azure/text-embedding-3-small
      api_key: os.environ/EMBEDDING_API_KEY
      api_base: os.environ/EMBEDDING_API_BASE
      api_version: "2023-05-15"
