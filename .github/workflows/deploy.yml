name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'docker-compose.yml'
      - 'Dockerfile'
      - 'scripts/**'
      - '.github/workflows/**'

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Deploy
        run: |
          cd ~/claw-docker
          git fetch origin main
          git reset --hard origin/main
          git clean -fd
          docker compose build --pull
          docker compose up -d --force-recreate --remove-orphans
      - name: Cleanup old Docker images
        run: docker image prune -af
