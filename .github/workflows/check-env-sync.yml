name: Check Env Sync

on:
  pull_request_target:
    branches: [main]
    paths:
      - 'docker-compose.yml'
      - '.env.example'

jobs:
  check-env:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Check .env.example matches docker-compose.yml
        run: bash scripts/check-env-sync.sh
