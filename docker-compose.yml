services:
  # ============================================
  # OpenClaw - AI 助手主体
  # 通过飞书/Web 等渠道与用户交互
  # 原生支持 GitHub Copilot 模型（无需额外代理）
  # updated: 2026-03-15 v2026.3.13
  # ============================================
  openclaw:
    build: .
    image: openclaw-custom:latest
    container_name: openclaw
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    environment:
      HOME: /home/node
      TERM: xterm-256color
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
      OPENCLAW_GATEWAY_MODE: local
      FEISHU_APP_ID: ${FEISHU_APP_ID}
      FEISHU_APP_SECRET: ${FEISHU_APP_SECRET}
      # GitHub Copilot 原生支持（通过 github-copilot provider）
      COPILOT_GITHUB_TOKEN: ${COPILOT_GITHUB_TOKEN}
      # 第三方集成（通过 .env 配置）
      NOTION_API_KEY: ${NOTION_API_KEY:-}
      GITHUB_PAT: ${GITHUB_PAT:-}
      BRAVE_API_KEY: ${BRAVE_API_KEY:-}
    volumes:
      - ./data/openclaw:/home/node/.openclaw
      - whisper-models:/home/node/.cache/huggingface
    ports:
      # Gateway 端口（飞书 webhook 需要公网访问，不能绑定 localhost）
      - "${OPENCLAW_GATEWAY_PORT:-18789}:18789"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    command:
      - "node"
      - "dist/index.js"
      - "gateway"
      - "--bind"
      - "lan"
      - "--port"
      - "18789"
      - "--allow-unconfigured"
    healthcheck:
      test: ["CMD", "node", "dist/index.js", "health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  whisper-models:
